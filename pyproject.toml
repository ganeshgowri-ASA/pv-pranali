[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pv-pranali"
version = "0.1.0"
description = "Self-driving multi-agent proposal system for PV test equipment"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
