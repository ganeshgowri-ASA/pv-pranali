requirements:
  # ── Performance ──────────────────────────────────────────────────────────
  - id: PERF-001
    section: Performance
    title: Irradiance Range
    priority: Must
    text: >
      The sun simulator shall provide stable irradiance between 700 W/m²
      and 1300 W/m² at the measurement plane.
    acceptance_criterion: >
      Measured irradiance (calibrated reference cell, ISO 9060 Class A)
      within ±2% of setpoint over full range.
    linked_standard: "IEC 60904-9:2020 §5.3"
    status: Open

  - id: PERF-002
    section: Performance
    title: Spatial Non-Uniformity
    priority: Must
    text: >
      Spatial non-uniformity of irradiance over the test area shall be
      Class A+ per IEC 60904-9:2020.
    acceptance_criterion: >
      Non-uniformity ≤2% measured per IEC 60904-9:2020 Annex A over
      2-module test plane (2000 × 1100 mm).
    linked_standard: "IEC 60904-9:2020 §5.2"
    status: Open

  - id: PERF-003
    section: Performance
    title: Temporal Instability
    priority: Must
    text: >
      Temporal instability of irradiance shall be Class A+ per IEC 60904-9:2020.
    acceptance_criterion: >
      Temporal instability ≤2% over I-V measurement window.
    linked_standard: "IEC 60904-9:2020 §5.4"
    status: Open

  - id: PERF-004
    section: Performance
    title: Spectral Match
    priority: Must
    text: >
      Spectral irradiance distribution shall match AM1.5G (IEC 60904-3)
      with Class A+ spectral match per IEC 60904-9:2020.
    acceptance_criterion: >
      Spectral match factor within 0.875–1.125 in each of the 6 wavelength
      intervals per IEC 60904-9:2020 Table 1.
    linked_standard: "IEC 60904-9:2020 §5.1, IEC 60904-3"
    status: Open

  - id: PERF-005
    section: Performance
    title: Module Capacity
    priority: Must
    text: >
      The simulator shall accommodate two full-size commercial PV modules
      simultaneously.
    acceptance_criterion: >
      Test area ≥ 2000 × 1100 mm; both modules measurable in single setup.
    linked_standard: "—"
    status: Open

  - id: PERF-006
    section: Performance
    title: Temperature Range
    priority: Must
    text: >
      Module/cell temperature shall be controllable between 20 °C and 75 °C.
    acceptance_criterion: >
      Setpoint stability ±0.5 °C; measured by calibrated Pt-100
      (IEC 60751 Class AA) in contact with module backsheet.
    linked_standard: "IEC 60891, IEC 60751"
    status: Open

  - id: PERF-007
    section: Performance
    title: I-V Measurement
    priority: Must
    text: >
      Full I-V curve measurement using 4-wire Kelvin connection per IEC 60904-1.
    acceptance_criterion: >
      Isc uncertainty ≤0.5%, Voc uncertainty ≤0.3%, Pmax uncertainty ≤1.5%
      (k=2, per ISO/IEC 17025).
    linked_standard: "IEC 60904-1, IEC 60891"
    status: Open

  # ── Safety ───────────────────────────────────────────────────────────────
  - id: SAFE-001
    section: Safety
    title: Electrical Safety
    priority: Must
    text: >
